# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
         # 2️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
           channel: stable
 
      - run: flutter build web --release
      # 5️⃣ Add version hash to index.html to force browser refresh
      - name: Add Version Hash for Cache Busting
        run: |
         COMMIT_HASH=$(git rev-parse --short HEAD)
         sed -i "s|</body>|<script>window.appVersion='${COMMIT_HASH}';</script></body>|" build/web/index.html    
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COUNTER_E1A13 }}
          channelId: live
          projectId: counter-e1a13
